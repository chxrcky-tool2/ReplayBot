name: Build ReplayBot

on:
  workflow_dispatch:
  push:
    branches: ["**"]

jobs:
  build:
    name: Android64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.31.6"
      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: v6.0.0-beta.1
          target: Android64
      - name: Upload .geode
        uses: actions/upload-artifact@v4
        with:
          name: ReplayBot-Android64
          path: "**/*.geode"
          if-no-files-found: error
